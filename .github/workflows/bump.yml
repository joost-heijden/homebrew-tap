name: Bump cask

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point the cask at the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cask=Casks/tickoala.rb
          tag=$(gh api repos/joost-heijden/Tickoala/releases/latest --jq .tag_name)
          version="${tag#v}"
          url="https://github.com/joost-heijden/Tickoala/releases/download/${tag}/Tickoala-${version}.zip"
          sha=$(curl -fsSL "$url" | shasum -a 256 | cut -d' ' -f1)
          # Guard: never write a broken version or checksum into the cask.
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$sha" =~ ^[0-9a-f]{64}$ ]]
          if [ "$sha" = "$(sed -n 's/^  sha256 "\(.*\)"/\1/p' "$cask")" ]; then
            echo "already at $version"
            exit 0
          fi
          sed -i "s/^  version \".*/  version \"${version}\"/" "$cask"
          sed -i "s/^  sha256 \".*/  sha256 \"${sha}\"/" "$cask"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "tickoala ${version}"
          git push
